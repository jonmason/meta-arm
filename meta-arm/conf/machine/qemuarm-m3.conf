#@TYPE: Machine
#@NAME: QEMU MPS2 Cortex-M3 machine
#@DESCRIPTION: Machine configuration for a bare-metal image on QEMU's MPS2 AN385

require conf/machine/include/arm/armv7m/tune-cortexm3.inc

TCLIBC = "picolibc"

# For runqemu
QB_SYSTEM_NAME = "qemu-system-arm"
QB_MACHINE = "-machine mps2-an385"
QB_MEM = "-m 16"
QB_OPT_APPEND = "-monitor none"
QB_SERIAL_OPT = "-serial stdio"
