#@TYPE: Machine
#@NAME: QEMU Arm Cortex-A57 machine
#@DESCRIPTION: Cortex-A57 (Armv8-A) with its Yocto tune on QEMU virt

MACHINEOVERRIDES =. "qemuarm64:"

require ${COREBASE}/meta/conf/machine/qemuarm64.conf
DEFAULTTUNE = "cortexa57"

KMACHINE = "qemuarm64"
SERIAL_CONSOLES_CHECK = "${SERIAL_CONSOLES}"

QB_CPU = "-cpu cortex-a57"
