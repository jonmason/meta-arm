header:
  version: 14

distro: poky

defaults:
  repos:
    branch: blacksail

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.20"
    commit: 634f8dede6b9d71b5a6691499fd05a8678b46eae
    layers:
      bitbake: disabled

  core:
    url: https://git.openembedded.org/openembedded-core
    commit: e182a0c4b91fd459c1f9dece0c7c23f7f9eaa7ab
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: d0119aa2eb77b985fcd33ac527d5c0287eb68e58
    layers:
      meta-poky:

  meta-arm:
    layers:
      meta-arm:
      meta-arm-bsp:
      meta-arm-toolchain:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: a9d69bc066bf9498397db27902c287dd666fdfd4
    layers:
      meta-oe:
      meta-python:
      meta-perl:

  meta-secure-core:
    url: https://github.com/wind-river/meta-secure-core.git
    branch: master
    commit: 56316bacdb3e79defca52ff016a406daa8034c67
    layers:
      meta-secure-core-common:
      meta-signing-key:
      meta-efi-secure-boot:

local_conf_header:
  base: |
    CONF_VERSION = "2"

  setup: |
    PACKAGE_CLASSES = "package_ipk"
    BB_NUMBER_THREADS ?= "16"
    PARALLEL_MAKE ?= "-j16"
    PACKAGECONFIG:append:pn-perf = " coresight"

machine: unset

target:
  - corstone1000-flash-firmware-image
