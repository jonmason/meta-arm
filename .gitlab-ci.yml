# Generate per-machine smoke jobs and run the remaining matrix only after
# that machine passes. See ci/machine-matrix.yml for the coverage list.
image: ${MIRROR_GHCR}/siemens/kas/kas:5.5

variables:
  MIRROR_GHCR: ghcr.io
  DEFAULT_TAG: ""

stages:
  - generate
  - trigger

generate-ci-config:
  stage: generate
  tags:
    - $DEFAULT_TAG
  script:
    - python3 ci/generate-ci-config > generated-ci.yml
  artifacts:
    paths:
      - generated-ci.yml

build-and-test:
  stage: trigger
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - artifact: generated-ci.yml
        job: generate-ci-config
    strategy: depend
    forward:
      pipeline_variables: true
