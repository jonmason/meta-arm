image: ghcr.io/siemens/kas/kas:3.2

variables:
  CPU_REQUEST: ""
  DEFAULT_TAG: ""
  # These are needed as the k8s executor doesn't respect the container entrypoint
  # by default
  FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY: 0
  FF_KUBERNETES_HONOR_ENTRYPOINT: 1
  # The directory to use as the persistent cache (the root for DL_DIR,
  # SSTATE_DIR, etc). The default is the build tree which will not be
  # persistent, so this should be set in the runner.
  CACHE_DIR: $CI_PROJECT_DIR

stages:
  - prep
  - build

# Common job fragment to get a worker ready
.setup:
  tags:
    - $DEFAULT_TAG
  stage: build
  interruptible: true
  variables:
    KAS_WORK_DIR: $CI_PROJECT_DIR/work
    KAS_BUILD_DIR: $KAS_WORK_DIR/build
    KAS_REPO_REF_DIR: ""
    SSTATE_DIR: $CACHE_DIR/sstate
    DL_DIR: $CACHE_DIR/downloads
    BB_LOGCONFIG: $CI_PROJECT_DIR/ci/logging.yml
    TOOLCHAIN_DIR: $CACHE_DIR/toolchains
    IMAGE_DIR: $CI_PROJECT_DIR/work/build/tmp/deploy/images
    TOOLCHAIN_LINK_DIR: $CI_PROJECT_DIR/work/build/toolchains
  before_script:
    - rm -rf $KAS_WORK_DIR
    - mkdir --verbose --parents $KAS_WORK_DIR $KAS_REPO_REF_DIR $SSTATE_DIR $DL_DIR $TOOLCHAIN_DIR $TOOLCHAIN_LINK_DIR
    # Must do this here, as it's the only way to make sure the toolchain is installed on the same builder
    - ./ci/get-binary-toolchains $DL_DIR $TOOLCHAIN_DIR $TOOLCHAIN_LINK_DIR

#
# Prep stage, update repositories once.
# Set the CI variable CI_CLEAN_REPOS=1 to refetch the respositories from scratch
#
update-repos:
  extends: .setup
  stage: prep
  script:
    - |
      exit_code=0

      printenv

      if [ -n "$KAS_REPO_REF_DIR" ]; then
        flock --verbose --timeout 60 $KAS_REPO_REF_DIR --command ./ci/update-repos || exit_code=$?
        # Exit now if that failed, unless the status was 128 (fetch failed)
        test $exit_code != 0 -a $exit_code != 128 && exit 1
      fi

      exit $exit_code
# Generate the downstream pipelines
linux-machine-config:
  stage: prep
  variables:
    TEST_LEVEL: 4
  script:
    - echo TEST_LEVEL = $TEST_LEVEL
    - for i in $(grep -L "trusted-firmware-m" ci/*.yml | xargs -i grep '^machine' {} | cut -d ':' -f 2 | sort -u | grep -v unset); do ./ci/generate-ci-config $i $TEST_LEVEL >> linux-machine-config.yml; done
    - cat linux-machine-config.yml
  artifacts:
    paths:
      - linux-machine-config.yml
    expire_in: 1 day

rtos-machine-config:
  stage: prep
  script:
    # avoid combinations that do not work on Zephyr or TF-M
    - for i in $(grep -l "trusted-firmware-m" ci/*.yml | xargs -i grep '^machine' {} | cut -d ':' -f 2 | sort -u | grep -v unset); do ./ci/generate-ci-config $i 1 >> rtos-machine-config.yml; done
    - cat rtos-machine-config.yml
  artifacts:
    paths:
      - rtos-machine-config.yml
    expire_in: 1 day


#
# Build stage, the actual build jobs
#

linux-machine-pipeline:
  stage: build
  needs:
    - job: update-repos
    - job: linux-machine-config
  trigger:
    strategy: depend
    include:
      - artifact: linux-machine-config.yml
        job: linux-machine-config

rtos-machine-pipeline:
  stage: build
  needs:
    - job: update-repos
    - job: rtos-machine-config
  trigger:
    strategy: depend
    include:
      - artifact: rtos-machine-config.yml
        job: rtos-machine-config

selftest:
  extends: .setup
  needs:
    - job: update-repos
  script:
    - KASFILES=./ci/qemuarm64.yml:./ci/selftest.yml
    - kas shell --update --force-checkout $KASFILES -c 'oe-selftest --num-processes 1 --run-tests runfvp'

# Validate layers are Yocto Project Compatible
check-layers:
  extends: .setup
  needs:
    - job: update-repos
  script:
    - kas shell --update --force-checkout ci/base.yml:ci/meta-openembedded.yml --command \
      "yocto-check-layer-wrapper $CI_PROJECT_DIR/$LAYER --dependency $CI_PROJECT_DIR/meta-* $KAS_WORK_DIR/meta-openembedded/meta-oe --no-auto-dependency"
  parallel:
    matrix:
      - LAYER: [meta-arm, meta-arm-bsp, meta-arm-toolchain, meta-gem5]

pending-updates:
  extends: .setup
  # Only run this job for the default branch (master), or if forced with
  # BUILD_FORCE_PENDING_UPDATES.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $BUILD_FORCE_PENDING_UPDATES != null
  artifacts:
    paths:
      - update-report
  script:
    - rm -fr update-report
    # This configuration has all of the layers we need enabled
    - kas shell ci/gem5-arm64.yml --command \
      "$CI_PROJECT_DIR/scripts/machine-summary.py -t report -o $CI_PROJECT_DIR/update-report $($CI_PROJECT_DIR/ci/listmachines.py meta-arm meta-arm-bsp meta-gem5)"
  # Do this on x86 whilst the compilers are x86-only
  tags:
    - x86_64

# What percentage of machines in the layer do we build
machine-coverage:
  extends: .setup
  stage: prep
  script:
    - ./ci/check-machine-coverage
  coverage: '/Coverage: \d+/'

metrics:
  extends: .setup
  artifacts:
    reports:
      metrics: metrics.txt
  script:
    - kas shell --update --force-checkout ci/base.yml --command \
      "$CI_PROJECT_DIR/ci/patchreview $CI_PROJECT_DIR/meta-* --verbose --metrics $CI_PROJECT_DIR/metrics.txt"
