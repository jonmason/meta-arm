# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14
  includes:
    - ci/meta-virtualization.yml
    - ci/poky-altcfg.yml

local_conf_header:
  meta-virt: |
    DISTRO_FEATURES:append = " virtualization xen"
    QB_DEFAULT_FSTYPE:pn-xen-image-minimal = "ext4.zst"
    QB_TCPSERIAL_OPT:pn-xen-image-minimal = ""
    # Dom0 reports QEMU PCI passthrough limitations in dmesg.
    TEST_SUITES:remove:pn-xen-image-minimal = "parselogs"
  sshd: |
    IMAGE_FEATURES:append = " ssh-server-openssh"

target:
  - xen-image-minimal
