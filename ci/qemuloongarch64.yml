# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14
  includes:
    - ci/base.yml

machine: qemuloongarch64

local_conf_header:
  kernel: |
    # linux-yocto has no qemuloongarch64 BSP definition.
    KBUILD_DEFCONFIG:qemuloongarch64 = "loongson64_defconfig"
    KERNEL_FEATURES:append:qemuloongarch64 = " ktypes/base/base.cfg cfg/8250.scc cfg/fs/ext4.scc"
    # Linux 7.2 builds the LoongArch EFI image as vmlinuz.efi.
    KERNEL_IMAGETYPE:qemuloongarch64 = "vmlinuz.efi"
    KERNEL_IMAGETYPES:qemuloongarch64 = "vmlinuz.efi"
  # Keep testimage coverage without desktop and perf dependencies.
  minimal: |
    CORE_IMAGE_EXTRA_INSTALL:remove = "perf"

target:
  - core-image-minimal
