#@TYPE: Machine
#@NAME: corstone310-fvp
#@DESCRIPTION: Arm Corstone-310 Fixed Virtual Platform

DEFAULTTUNE = "armv8-1m-main"
require conf/machine/include/arm/arch-armv8-1m-main.inc

TCLIBC = "newlib"
TFM_PLATFORM = "arm/mps3/corstone310/fvp"
COMPATIBLE_MACHINE:pn-trusted-firmware-m-tests = "corstone310-fvp"
TFM_TEST_FVP = "FVP_Corstone_SSE-310"
TFM_TEST_MODEL_DEPENDS:pn-trusted-firmware-m-tests = "fvp-corstone310-native:do_populate_sysroot"
TFM_TEST_IMAGE_ADDR = "0x38000000"
