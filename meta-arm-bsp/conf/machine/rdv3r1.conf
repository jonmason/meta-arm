FVP_CONFIG[socket0.ros0.virtio_net.enabled] ?= "1"
FVP_CONFIG[socket0.ros0.virtio_net.transport] ?= "legacy"
FVP_CONFIG[socket0.ros0.virtio_net.hostbridge.userNetworking] ?= "1"
FVP_CONFIG[socket0.ros0.virtio_net.hostbridge.userNetPorts] = "2222=22"
FVP_CONFIG[socket0.ros0.virtio_rng.enabled] ?= "1"
FVP_CONFIG[socket0.ros0.virtioblockdevice.image_path] ?= "${IMAGE_NAME}.wic"

FVP_CONSOLES[default] = "terminal_ns_uart0"
FVP_CONSOLES[rse] = "terminal_rse_uart"
FVP_CONSOLES[scp] = "terminal_uart_scp"
FVP_CONSOLES[mcp] = "terminal_uart_mcp"
FVP_CONSOLES[lcp] = "terminal_uart_lcp"
FVP_CONSOLES[secure] = "terminal_sec_uart"
FVP_TERMINALS[socket0.css0.sysctrl.terminal_rse_uart] ?= "RSE0"
FVP_TERMINALS[socket0.css0.sysctrl.scp.terminal_uart_scp] ?= "SCP0"
FVP_TERMINALS[socket0.css0.sysctrl.scp.terminal_uart_lcp] ?= "LCP0"
FVP_TERMINALS[socket0.css0.sysctrl.mcp.terminal_uart_mcp] ?= "MCP0"
FVP_TERMINALS[socket0.css0.ap_periph.terminal_sec_uart] ?= "Secure0"
FVP_TERMINALS[socket0.css0.ap_periph.terminal_ns_uart0] ?= "Linux"
FVP_TERMINALS[socket0.css0.ap_periph.terminal_ns_uart1] ?= "RMM"
FVP_TERMINALS[socket0.css1.sysctrl.terminal_rse_uart] ?= "RSE1"
FVP_TERMINALS[socket0.css1.sysctrl.scp.terminal_uart_scp] ?= "SCP1"
FVP_TERMINALS[socket0.css1.sysctrl.scp.terminal_uart_lcp] ?= "LCP1"
FVP_TERMINALS[socket0.css1.sysctrl.mcp.terminal_uart_mcp] ?= "MCP1"
