# Configuration for the two-chip Arm Neoverse RD V3 R1

#@TYPE: Machine
#@NAME: RD V3 R1
#@DESCRIPTION: Machine configuration for RD V3 R1

require conf/machine/include/arm/arch-armv9a.inc

EXTRA_IMAGEDEPENDS += "rdv3r1-firmware-image:do_deploy"

KERNEL_IMAGETYPE ?= "Image"
PREFERRED_PROVIDER_virtual/kernel:forcevariable = "linux-yocto"
SERIAL_CONSOLES = "115200;ttyAMA0 115200;ttyAMA1"

EFI_PROVIDER ?= "${@bb.utils.contains("DISTRO_FEATURES", "systemd", "systemd-boot", "grub-efi", d)}"
MACHINE_FEATURES += "efi"

IMAGE_FSTYPES:forcevariable = "cpio.gz wic"
IMAGE_NAME_SUFFIX = ""
IMAGE_CLASSES += "fvpboot"

WKS_FILE ?= "efi-disk.wks.in"
WKS_FILE_DEPENDS:append = " rdv3r1-firmware-image"

TEST_TARGET = "OEFVPTarget"
TEST_TARGET_IP = "127.0.0.1:2222"
DEFAULT_TEST_SUITES:append = " fvp_boot fvp_devices"
TEST_FVP_DEVICES ?= "rtc watchdog networking virtiorng cpu_hotplug"

FVP_PROVIDER ?= "fvp-rdv3-r1-native"
FVP_EXE ?= "FVP_RD_V3_R1"
FVP_EXTRA_ARGS ?= "-I -R"

FVP_CONFIG[socket0.css0.sysctrl.rse.rom.raw_image] ?= "tf_m_rom.bin"
FVP_CONFIG[socket0.css1.sysctrl.rse.rom.raw_image] ?= "tf_m_rom.bin"
FVP_DATA ?= "socket0.css0.sysctrl.rse.cpu=tf_m_flash.bin@0xB0000000 \
             socket0.css0.sysctrl.rse.cpu=tf_m_vm0_0.bin@0x31000400 \
             socket0.css0.sysctrl.rse.cpu=tf_m_vm1_0.bin@0x31080000 \
             socket0.css1.sysctrl.rse.cpu=tf_m_flash.bin@0xB0000000 \
             socket0.css1.sysctrl.rse.cpu=tf_m_vm0_1.bin@0x31000400 \
             socket0.css1.sysctrl.rse.cpu=tf_m_vm1_1.bin@0x31080000"

FVP_CONFIG[socket0.ros0.flashloader0.fname] ?= "fip-rdv3r1.bin"
FVP_CONFIG[socket0.ros0.flashloader1.fname] ?= "nor1_flash.img"
FVP_CONFIG[socket0.ros0.flashloader1.fnameWrite] ?= "nor1_flash.img"
FVP_CONFIG[socket0.ros0.flashloader2.fname] ?= "nor2_flash.img"
FVP_CONFIG[socket0.ros0.flashloader2.fnameWrite] ?= "nor2_flash.img"

FVP_CONFIG[socket0.ros0.dram_2nd_range_base] ?= "0x20080000000"
FVP_CONFIG[socket0.ros0.dram_2nd_range_top] ?= "0x201FFFFFFFF"
FVP_CONFIG[socket0.ros1.dram_2nd_range_base] ?= "0x30080000000"
FVP_CONFIG[socket0.ros1.dram_2nd_range_top] ?= "0x301FFFFFFFF"

FVP_CONFIG[socket0.board0.rse2rse_mhu0.NUM_CH] ?= "16"
FVP_CONFIG[socket0.board1.rse2rse_mhu0.NUM_CH] ?= "16"
FVP_CONFIG[socket0.css0.sysctrl.rse.CMU4_NUM_DB_CH] ?= "5"
FVP_CONFIG[socket0.css1.sysctrl.rse.CMU4_NUM_DB_CH] ?= "5"
FVP_CONFIG[socket0.css0.sysctrl.rse.CMU0_NUM_DB_CH] ?= "16"
FVP_CONFIG[socket0.css1.sysctrl.rse.CMU0_NUM_DB_CH] ?= "16"
FVP_CONFIG[socket0.css0.sysctrl.rse.DISABLE_GATING] ?= "true"
FVP_CONFIG[socket0.css1.sysctrl.rse.DISABLE_GATING] ?= "true"
FVP_CONFIG[socket0.css0.gic_distributor.SPI-blocks] ?= "60"
FVP_CONFIG[socket0.css1.gic_distributor.SPI-blocks] ?= "60"
FVP_CONFIG[socket0.css0.gic_distributor.enable-local-cross-chip-addressing] ?= "false"
FVP_CONFIG[socket0.css1.gic_distributor.enable-local-cross-chip-addressing] ?= "false"

FVP_CONFIG[socket0.pcie_group0_to_css0.pcie4.hierarchy_file_name] ?= "<default>"
FVP_CONFIG[socket0.pcie_group1_to_css0.pcie4.hierarchy_file_name] ?= "<default>"
FVP_CONFIG[socket0.pcie_group0_to_css1.pcie4.hierarchy_file_name] ?= "<default>"
FVP_CONFIG[socket0.pcie_group1_to_css1.pcie4.hierarchy_file_name] ?= "<default>"
FVP_CONFIG[socket0.pcie_group0_to_css0.pcie4.pcie_rc.ahci0.endpoint.ats_supported] ?= "true"
FVP_CONFIG[socket0.pcie_group1_to_css0.pcie4.pcie_rc.ahci0.endpoint.ats_supported] ?= "true"
FVP_CONFIG[socket0.pcie_group0_to_css1.pcie4.pcie_rc.ahci0.endpoint.ats_supported] ?= "true"
FVP_CONFIG[socket0.pcie_group1_to_css1.pcie4.pcie_rc.ahci0.endpoint.ats_supported] ?= "true"

# Match the PCIe address windows used by the RD-INFRA model launcher.
FVP_CONFIG[socket0.pcie_group0_to_css0.pcie0.cfg_start] ?= "0x10000000000"
FVP_CONFIG[socket0.pcie_group0_to_css0.pcie0.cfg_end] ?= "0x1000FFFFFFF"
