#@TYPE: Machine
#@NAME: corstone300-fvp
#@DESCRIPTION: Arm Corstone-300 Fixed Virtual Platform

DEFAULTTUNE = "armv8-1m-main"
require conf/machine/include/arm/armv8-1m/tune-cortexm55.inc

TCLIBC = "newlib"
TFM_PLATFORM = "arm/mps3/corstone300/fvp"
COMPATIBLE_MACHINE:pn-trusted-firmware-m-tests = "corstone300-fvp"
TFM_TEST_FVP = "FVP_Corstone_SSE-300_Ethos-U55"
TFM_TEST_MODEL_DEPENDS:pn-trusted-firmware-m-tests = "fvp-corstone300-native:do_populate_sysroot"
TFM_TEST_IMAGE_ADDR = "0x38000000"
