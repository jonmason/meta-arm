#@TYPE: Machine
#@NAME: TC3 FVP
#@DESCRIPTION: Arm Total Compute 3 Fixed Virtual Platform

require conf/machine/include/arm/arch-armv9a.inc

MACHINEOVERRIDES =. "tc:"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
KERNEL_IMAGETYPE = "Image"
KERNEL_CLASSES = "kernel-fit-extra-artifacts"
INITRAMFS_IMAGE = "core-image-minimal"

UBOOT_MACHINE = "total_compute_defconfig"
UBOOT_LOADADDRESS = "0x80080000"
UBOOT_ENTRYPOINT = "0x80080000"
UBOOT_RD_LOADADDRESS = "0x88000000"
UBOOT_RD_ENTRYPOINT = "0x88000000"

IMAGE_FSTYPES += "cpio.gz"
IMAGE_NAME_SUFFIX = ""
IMAGE_CLASSES += "fvpboot"
SERIAL_CONSOLES = "115200;ttyAMA0"

EXTRA_IMAGEDEPENDS += "tc3-firmware-image"
TESTIMAGEDEPENDS:append = " linux-yocto-fitimage:do_deploy"
TEST_TARGET = "OEFVPTarget"
TEST_SUITES = "fvp_boot"
TEST_FVP_LINUX_BOOT_TIMEOUT = "900"

FVP_PROVIDER = "fvp-tc3-native"
FVP_EXE = "FVP_TC3"
FVP_CONSOLES[default] = "terminal_uart_ap"
FVP_TERMINALS[css.terminal_uart_ap] = "AP Console"
FVP_TERMINALS[css.terminal_uart1_ap] = "Secure Console"
FVP_TERMINALS[soc.terminal_s0] = "SCP Console"
FVP_TERMINALS[soc.terminal_s1] = "RSE Console"

FVP_CONFIG[board.flashloader0.fname] = "tc3-firmware-image/fip_gpt-tc.bin"
FVP_CONFIG[css.sms.rse.rom.raw_image] = "trusted-firmware-m/bl1_1.bin"
FVP_CONFIG[css.sms.rse.VMADDRWIDTH] = "16"
FVP_CONFIG[css.sms.rse.intchecker.ICBC_RESET_VALUE] = "0x0000011B"
FVP_CONFIG[css.sms.rse.sic.SIC_AUTH_ENABLE] = "1"
FVP_CONFIG[css.sms.rse.sic.SIC_DECRYPT_ENABLE] = "1"

FVP_DATA = "css.sms.rse.sram0=trusted-firmware-m/cm_provisioning_message.bin@0x400 \
            css.sms.rse.sram1=trusted-firmware-m/dm_provisioning_message.bin@0x0 \
            board.dram=fitImage-core-image-minimal-tc3-tc3@0x20000000"
